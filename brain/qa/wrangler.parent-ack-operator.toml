# Remote-only ephemeral dev probe. No public route, cron, AI, repair or write key.
# Only this QA operator is temporarily granted a cross-script DO binding.
name = "archelaos-canonical-ack-one-shot-qa"
main = "parent_ack_operator_worker.mjs"
compatibility_date = "2026-11-01"
workers_dev = false
preview_urls = false

[dev]
ip = "127.0.0.1"
port = 8799
local_protocol = "http"

[[services]]
binding = "BRAIN_RECOVERY"
service = "archelaos-brain-staging"
entrypoint = "BrainRecoveryPort"

[[durable_objects.bindings]]
name = "BRAIN"
class_name = "BrainCoordinator"
script_name = "archelaos-brain-staging"
