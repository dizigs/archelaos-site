name: Weekly public archive snapshot
on:
  schedule:
    - cron: '43 3 * * 0'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify complete archive release
        run: python rebuild/tools/build_release.py
      - name: Record public database hashes and counts
        run: python rebuild/tools/public_snapshot.py
      - name: Preserve restore-ready public data (no private Drive)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-archive-snapshot
          path: |
            dist/assets/site/data/
            public-archive-manifest.json
          retention-days: 30
          if-no-files-found: error

      - name: Stage canonical public root registries (news, Hall, historic events only)
        run: |
          python -m unittest discover -s rebuild/tests -p 'canonical_root_snapshot_test.py' -v
          python rebuild/tools/canonical_root_snapshot.py --stage
          python rebuild/tools/canonical_root_snapshot.py --verify
      - name: Preserve source-of-truth public JSON separately (no private Drive)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: canonical-root-public-snapshot
          path: ${{ runner.temp }}/archelaos-public-canonical/
          retention-days: 30
          if-no-files-found: error
