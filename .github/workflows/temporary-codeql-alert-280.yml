name: Temporary CodeQL alert 13 state attestation

on:
  pull_request:
    paths:
      - '.github/workflows/temporary-codeql-alert-280.yml'

permissions:
  contents: read

jobs:
  evidence:
    name: Read only exact CodeQL alert state
    if: github.event.pull_request.number == 284 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      security-events: read
    steps:
      - name: Attest alert 13 state without disclosing its security findings
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          resource="repos/${GITHUB_REPOSITORY}/code-scanning/alerts/13"
          state="$(gh api "$resource" --jq '.state')"
          state_type="$(gh api "$resource" --jq '.state | type')"
          state_readback="$(gh api "$resource" --jq 'if .state == null then "NULL" elif (.state | type) == "string" then .state else "NON_STRING" end')"
          fixed_flag="$(gh api "$resource" --jq 'if .fixed_at == null then "NO" else "YES" end')"
          dismissed_flag="$(gh api "$resource" --jq 'if .dismissed_at == null then "NO" else "YES" end')"
          case "$state_type" in string|null) ;; *) echo "ALERT_STATE_TYPE_INVALID"; exit 1;; esac
          case "$state_readback" in open|fixed|dismissed|NULL|"") ;; *) echo "ALERT_STATE_UNEXPECTED"; exit 1;; esac
          printf 'ALERT_13_STATE_TYPE=%s\n' "$state_type"
          printf 'ALERT_13_STATE_READBACK=%s\n' "${state_readback:-EMPTY}"
          printf 'ALERT_13_FIXED_AT_PRESENT=%s\n' "$fixed_flag"
          printf 'ALERT_13_DISMISSED_AT_PRESENT=%s\n' "$dismissed_flag"
          instances="$(gh api "$resource/instances?pr=280" --jq 'length')"
          if ! [[ "$instances" =~ ^[0-9]+$ ]]; then
            echo 'ALERT_INSTANCE_COUNT_INVALID'
            exit 1
          fi
          printf 'PR280_ALERT_13_INSTANCE_COUNT=%s\n' "$instances"
          echo 'NO_ALERT_CONTENT_OR_TOKEN_PRINTED'
