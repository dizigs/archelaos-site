name: Brain Builders - Synthetic Cross-PR Acceptance

on:
  pull_request:
    paths:
      - 'automation/brain-worker-executors/acceptance/**'
      - '.github/workflows/brain-builder-acceptance.yml'

permissions: {}

concurrency:
  group: brain-builder-synthetic-acceptance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  synthetic-contracts:
    permissions:
      contents: read
      pull-requests: read
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ACCEPTANCE_SOURCE_DIR: ${{ github.workspace }}/.acceptance-sources
    steps:
      - name: Checkout only the acceptance PR source (no write credentials)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Checkout scaffold PR 209 exact SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: dizigs/archelaos-site
          ref: ed1285d1c61aa94de9fb19360ba9d95e12110e92
          path: .acceptance-sources/scaffold
          persist-credentials: false
      - name: Checkout Gemini PR 214 exact SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: dizigs/archelaos-site
          ref: c2ec74fac9845ee3dea948c8da65d62e94e37bed
          path: .acceptance-sources/gemini
          persist-credentials: false
      - name: Checkout Gemma PR 211 exact SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: dizigs/archelaos-site
          ref: 06d9a8d16aebbb4d0c9317d394af54763b3ea647
          path: .acceptance-sources/gemma
          persist-credentials: false
      - name: Checkout Testing PR 212 exact SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: dizigs/archelaos-site
          ref: d0d06f75a3405f1f0e2ab368bc2a774ba8cde084
          path: .acceptance-sources/testing
          persist-credentials: false
      - name: Checkout Coordinator PR 213 exact SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: dizigs/archelaos-site
          ref: e63052d7c0d7d75f4332e6f9c822067b6b0c3d5e
          path: .acceptance-sources/integration
          persist-credentials: false
      - name: Checkout canonical Brain PR 219 actual merged SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: dizigs/archelaos-site
          ref: 8f7de8ba14385d762e52c946f6ed140088f863dc
          path: .acceptance-sources/brain
          persist-credentials: false
      - name: Validate exact source pins, read-only
        run: node automation/brain-worker-executors/acceptance/verify-pins.mjs
      - name: Validate source PR heads have not moved, read-only
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node automation/brain-worker-executors/acceptance/verify-source-heads.mjs
      - name: Install pinned canonical Brain local simulation tools
        run: npm ci --prefix .acceptance-sources/brain/brain --ignore-scripts --no-audit --no-fund
      - name: Validate canonical Brain budget, sqlite leases and recovery in local Miniflare
        working-directory: .acceptance-sources/brain/brain
        run: node --test --test-concurrency=1 test/budget.test.mjs test/exec_authority.test.mjs
      - name: Re-run native tests for the pinned source modules (mock-only)
        run: |
          node --test .acceptance-sources/scaffold/automation/brain-worker-executors/*.test.mjs
          node --test .acceptance-sources/gemini/automation/brain-worker-executors/providers/gemini/*.test.mjs
          node --test .acceptance-sources/gemma/automation/brain-worker-executors/providers/gemma/*.test.mjs
          node --test .acceptance-sources/testing/automation/brain-worker-executors/testing/*.test.mjs
          node --test .acceptance-sources/integration/automation/brain-worker-executors/integration/*.test.mjs
      - name: Verify cross-module synthetic end-to-end and fail-closed contracts
        run: node --test automation/brain-worker-executors/acceptance/*.test.mjs

  independent-ci-attestation:
    permissions:
      contents: read
      actions: read
      checks: read
    if: always() && github.event.pull_request.head.repo.full_name == github.repository
    needs: synthetic-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout exact source for immutable CI audit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Read-only actual SHA, workflow run, attempt, jobs, SonarCloud and CodeQL
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ACCEPTANCE_SHA: ${{ github.event.pull_request.head.sha }}
          ACCEPTANCE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: node automation/brain-worker-executors/acceptance/verify-ci-evidence.mjs
