name: Apps Script final integration safety gates
on:
  pull_request:
    paths:
      - 'automation/apps-script-final-integration/**'
      - '.github/workflows/apps-script-final-integration-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readonly-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Static and synthetic fail-closed contract tests (NO SECRETS)
        run: |
          node --check automation/apps-script-final-integration/integration.mjs
          node --check automation/apps-script-final-integration/merged-contracts.mjs
          node --test automation/apps-script-final-integration/*.test.mjs
