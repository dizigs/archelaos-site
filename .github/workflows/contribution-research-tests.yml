name: Contribution research offline tests
on:
  pull_request:
    paths:
      - 'rebuild/tools/contribution_research.py'
      - 'rebuild/tools/search_contribution_leads.py'
      - 'rebuild/tools/draft_contribution_research.py'
      - 'rebuild/tools/match_contribution_records.py'
      - 'rebuild/tools/build_archive_links.py'
      - 'news.json'
      - 'hall-of-fame-people.json'
      - 'rebuild/data/interviews.json'
      - 'rebuild/data/stories.json'
      - 'rebuild/data/moments.json'
      - 'rebuild/data/museum.json'
      - 'rebuild/tests/contribution_pipeline_test.py'
      - '.github/workflows/contribution-research-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile modules
        run: python -m py_compile rebuild/tools/contribution_research.py rebuild/tools/search_contribution_leads.py rebuild/tools/draft_contribution_research.py rebuild/tools/match_contribution_records.py rebuild/tools/build_archive_links.py
      - name: Run offline regression tests
        run: python -m unittest discover -s rebuild/tests -p contribution_pipeline_test.py -v
      - name: Build reciprocal archive link proposals (not published)
        run: python rebuild/tools/build_archive_links.py
