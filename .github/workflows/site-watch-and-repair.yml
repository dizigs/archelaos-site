name: Site watch and safe repair
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: site-watch-and-repair
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test known safe repairs and HTML regression guards
        run: |
          python -m unittest discover -s rebuild/tests -p 'auto_fix_html_escapes_test.py' -v
          python -m unittest discover -s rebuild/tests -p 'fault_injection_self_heal_test.py' -v
          python -m unittest discover -s rebuild/tests -p 'guard_html_escaped_text_test.py' -k test_reject_ -k test_ignore_ -v
          python -m unittest discover -s rebuild/tests -p 'sitewide_self_heal_test.py' -v

      - name: Live public-site check (read-only)
        id: live
        continue-on-error: true
        run: |
          mkdir -p rebuild/test-artifacts
          python rebuild/tools/live_site_health.py --json rebuild/test-artifacts/live-site-health.json

      - name: Detect literal escaped UI text in source
        id: escapes
        continue-on-error: true
        run: python rebuild/tools/guard_html_escaped_text.py

      - name: Normalize site-wide incidents without visitor data
        if: always()
        run: |
          python rebuild/tools/site_health_events.py \
            --input rebuild/test-artifacts/live-site-health.json \
            --output rebuild/test-artifacts/site-health-events.json

      - name: Keep anonymized history in restricted Actions artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-watch-${{ github.run_id }}
          path: rebuild/test-artifacts/site-health-events.json
          if-no-files-found: error
          retention-days: 30

      - name: Create or refresh ONE site incident issue
        if: always() && (steps.live.outcome == 'failure' || steps.escapes.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_LINK: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LIVE_FAILED: ${{ steps.live.outcome }}
          ESCAPES_FAILED: ${{ steps.escapes.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          title="Site QA: automated monitor alert"
          number=$(gh issue list --repo "$REPO" --state open --limit 100 --search 'in:title "Site QA: automated monitor alert"' --json number,title \
            --jq '.[] | select(.title == "Site QA: automated monitor alert") | .number' | head -1)
          summary=$(python - <<'PY'
          import json
          from pathlib import Path
          p = Path("rebuild/test-artifacts/site-health-events.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          print(", ".join(f"{e['code']}:{e['fingerprint']}" for e in data["events"] if e["severity"] == "error") or "source guard failure")
          PY
          )
          note="Automated public-site checks failed on run $RUN_LINK. Live health: $LIVE_FAILED. Escaped HTML: $ESCAPES_FAILED. Incident signatures: $summary. Sanitized 30-day artifact; no private request logs. No auto-publish of unknown fixes."
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$REPO" --body "$note"
          else
            gh issue create --repo "$REPO" --title "$title" --body "$note"
          fi

      - name: Prepare a scoped known-fix patch (no direct main commits)
        id: fix
        shell: bash
        run: |
          set -euo pipefail
          python rebuild/tools/auto_fix_html_escapes.py --apply
          mapfile -d '' -t changed_files < <(git diff --name-only -z)
          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - "${changed_files[@]}" <<'PY'
          import sys
          from rebuild.tools.auto_fix_html_escapes import ALLOWLIST
          changed = sys.argv[1:]
          if not changed or len(set(changed)) != len(changed) or not set(changed).issubset(set(ALLOWLIST)):
              raise SystemExit("Unsafe self-heal diff: unexpected or duplicate file")
          print("Allowlisted self-heal changes:", ", ".join(changed))
          PY
          python rebuild/tools/guard_html_escaped_text.py
          python rebuild/tools/build_release.py
          python rebuild/tools/guard_html_escaped_text.py --dist
          python rebuild/tools/verify_release.py
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open CI-gated repair pull request instead of touching production
        if: steps.fix.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if gh pr list --repo "$REPO" --state open --limit 100 --json title \
              --jq '.[].title' | grep -Fxq 'auto-heal: repair allowlisted public HTML head whitespace'; then
            echo "A repair PR already exists; not creating a duplicate."
            exit 0
          fi
          branch="bot/repair-html-escapes-$GITHUB_RUN_ID"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          mapfile -d '' -t changed_files < <(git diff --name-only -z)
          git add -- "${changed_files[@]}"
          git commit -m "fix(site): repair approved HTML head whitespace"
          git push origin "$branch"
          gh pr create --repo "$REPO" --base main --head "$branch" \
            --title 'auto-heal: remove visible escaped whitespace in news.html' \
            --body 'Automated head-only repair on reviewed public pages. No biography or private intake edits, no production write. Requires CI and merge rules. See sanitized event history in originating Actions run.'

      - name: Fail monitoring run if live site still has unknown issues
        if: steps.live.outcome == 'failure' || (steps.escapes.outcome == 'failure' && steps.fix.outputs.changed != 'true')
        run: exit 1
