name: Site watch and safe repair
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  pull_request:
    paths:
      - 'tools/self_heal_*.py'
      - 'tests/test_self_heal_*.py'
      - '.github/workflows/site-watch-and-repair.yml'

permissions:
  contents: read

concurrency:
  group: site-watch-and-repair
  cancel-in-progress: false

jobs:
  controller-regression:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_self_heal_*.py' -v

  controlled-fixture:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/codex/self-heal-staging-')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify bounded controller and API regressions
        run: python -m unittest discover -s tests -p 'test_self_heal_*.py' -v
      - name: Isolated central-site fault to tested deduplicated draft PR
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          SOURCE_RUN: ${{ github.run_id }}
        run: python tools/self_heal_fixture.py --source-commit "$SOURCE_SHA" --branch "$SOURCE_BRANCH" --run-id "$SOURCE_RUN"

  monitor:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Test known safe repairs and HTML regression guards
        run: |
          python -m unittest discover -s tests -p 'test_self_heal_*.py' -v
          python -m unittest discover -s rebuild/tests -p 'auto_fix_html_escapes_test.py' -v
          python -m unittest discover -s rebuild/tests -p 'fault_injection_self_heal_test.py' -v
          python -m unittest discover -s rebuild/tests -p 'repair_pr_lookup_test.py' -v
          python -m unittest discover -s rebuild/tests -p 'guard_html_escaped_text_test.py' -k test_reject_ -k test_ignore_ -v

      - name: Live public-site check (read-only)
        id: live
        continue-on-error: true
        run: |
          mkdir -p rebuild/test-artifacts
          python rebuild/tools/live_site_health.py --json rebuild/test-artifacts/live-site-health.json

      - name: Detect literal escaped UI text in source
        id: escapes
        continue-on-error: true
        run: python rebuild/tools/guard_html_escaped_text.py

      - name: Keep reports in restricted GitHub Actions artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-watch-${{ github.run_id }}
          path: rebuild/test-artifacts/live-site-health.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Persist bounded incident decisions and propose only tested draft repairs
        if: always() && (steps.live.outcome == 'failure' || steps.escapes.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_RUN: ${{ github.run_id }}
          LIVE_OUTCOME: ${{ steps.live.outcome }}
          ESCAPES_OUTCOME: ${{ steps.escapes.outcome }}
        run: python tools/self_heal_monitor.py --source-commit "$SOURCE_SHA" --run-id "$SOURCE_RUN" --live "$LIVE_OUTCOME" --escapes "$ESCAPES_OUTCOME"

      - name: Keep monitoring failed until actual health is restored
        if: always() && (steps.live.outcome != 'success' || steps.escapes.outcome != 'success')
        run: exit 1
