name: Free OpenSSF Scorecard audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scorecard-free.yml'
  schedule:
    - cron: '37 6 * * 3'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scorecard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Run OSSF Scorecard v2.5.0
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: false
      - name: Save Scorecard report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scorecard-security-report
          path: scorecard-results.sarif
          if-no-files-found: warn
          retention-days: 14
