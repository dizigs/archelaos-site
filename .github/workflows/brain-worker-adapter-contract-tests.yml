name: Cloudflare Brain adapter offline contract tests
on:
  pull_request:
    paths:
      - 'automation/cloudflare-brain-integration/**'
      - 'brain/src/contract.mjs'
      - 'brain/src/worker.mjs'
      - '.github/workflows/brain-worker-adapter-contract-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: brain-adapter-contract-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  adapter-contract:
    name: Cloudflare Brain adapter mock contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Syntax-check isolated adapter and tests
        run: |
          node --check automation/cloudflare-brain-integration/client.mjs
          node --check automation/cloudflare-brain-integration/client.test.mjs
      - name: Execute Brain Service Binding synthetic contract tests
        run: node --test automation/cloudflare-brain-integration/client.test.mjs
