name: P0 CLI security regressions
on:
  pull_request:
    paths:
      - 'rebuild/tools/live_sync_audit.py'
      - 'rebuild/tests/live_sync_security_test.py'
      - '.github/workflows/p0-cli-security.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Exercise real Git boundary in disposable fixtures
        run: python rebuild/tests/live_sync_security_test.py
