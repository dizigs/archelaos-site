name: P0 CLI security regressions
on:
  pull_request:
    paths:
      - 'rebuild/tools/toolbox.py'
      - 'rebuild/tests/toolbox_security_test.py'
      - 'rebuild/tools/live_sync_audit.py'
      - 'rebuild/tests/live_sync_security_test.py'
      - 'rebuild/tools/import_match_calendar.py'
      - 'rebuild/tools/public_snapshot.py'
      - 'rebuild/tests/calendar_output_security_test.py'
      - 'rebuild/tests/match_calendar_import.py'
      - '.github/workflows/p0-cli-security.yml'
  push:
    branches: [main]
    paths:
      - 'rebuild/tools/toolbox.py'
      - 'rebuild/tests/toolbox_security_test.py'
      - 'rebuild/tools/live_sync_audit.py'
      - 'rebuild/tests/live_sync_security_test.py'
      - 'rebuild/tools/import_match_calendar.py'
      - 'rebuild/tools/public_snapshot.py'
      - 'rebuild/tests/calendar_output_security_test.py'
      - 'rebuild/tests/match_calendar_import.py'
      - '.github/workflows/p0-cli-security.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Exercise real Git boundary in disposable fixtures
        run: python rebuild/tests/live_sync_security_test.py
      - name: Exercise calendar report links, directory swaps and review-only imports
        run: |
          python -m unittest discover -s rebuild/tests -p calendar_output_security_test.py -v
          python rebuild/tests/match_calendar_import.py
      - name: Verify fixed toolbox dispatch and literal editorial arguments
        run: python -m unittest discover -s rebuild/tests -p toolbox_security_test.py -v
