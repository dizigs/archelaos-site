name: Brain GAS envelope compatibility tests
on:
  pull_request:
    paths:
      - 'automation/brain-gas-envelope-compat/**'
      - 'brain/src/contract.mjs'
      - '.github/workflows/brain-gas-envelope-compat.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify canonical GAS compatibility denies unapproved source
        run: node --test automation/brain-gas-envelope-compat/inspect.test.mjs
