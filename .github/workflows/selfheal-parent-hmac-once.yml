name: Self-Heal parent HMAC acceptance (one-shot, no repair)

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.github/workflows/selfheal-parent-hmac-once.yml'
      - 'brain/qa/live_parent_hmac_once.py'

permissions:
  contents: read

jobs:
  one-shot:
    if: >-
      github.repository == 'dizigs/archelaos-site' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'assistant/selfheal-parent-hmac-live-once-20261107' &&
      github.event.pull_request.number == 299
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: archelaos-existing-parent-hmac-20261107
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Source-only static guard (no Cloudflare credentials)
        run: |
          python3 -m py_compile brain/qa/live_parent_hmac_once.py
          python3 brain/qa/live_parent_hmac_once.py config
          git diff --check

      - name: Diagnose exact Sonar security findings (read-only)
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.parse,urllib.request,urllib.error
          headers={'Accept':'application/json','User-Agent':'archelaos-sonar-security-diagnostic'}
          params=urllib.parse.urlencode({'componentKeys':'dizigs_archelaos-site','pullRequest':'299',
            'impactSoftwareQualities':'SECURITY','issueStatuses':'OPEN,CONFIRMED','ps':'100'})
          try:
              r=urllib.request.Request('https://sonarcloud.io/api/issues/search?'+params,headers=headers)
              with urllib.request.urlopen(r,timeout=16) as response:
                  data=response.read(100001)
                  if len(data)>100000: raise ValueError('TOO_MANY_ISSUES')
                  issues=json.loads(data)
              print('SONAR_SECURITY_COUNT',issues.get('total','UNKNOWN'))
              for issue in issues.get('issues',[])[:30]:
                  print('SONAR_SECURITY_FINDING',str(issue.get('component',''))[:120],
                    str(issue.get('line',''))[:10],str(issue.get('rule',''))[:70],
                    str(issue.get('message','')).replace('\n',' ')[:360])
          except (urllib.error.HTTPError,urllib.error.URLError,ValueError) as error:
              print('SONAR_READ_BLOCKED',str(getattr(error,'code',type(error).__name__)))
          PY

      - name: Operator-gated exact commit subject
        id: gate
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          if [ "$(git log -1 --format=%s)" = 'qa(live): one-shot bounded parent HMAC' ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'Parent HMAC one-shot NOT authorized on this commit.'
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.gate.outputs.enabled == 'true'
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Locked Wrangler and dry-run both existing sources
        if: steps.gate.outputs.enabled == 'true'
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          npm ci --prefix brain --ignore-scripts --no-audit --no-fund
          ./brain/node_modules/.bin/wrangler deploy --config brain/wrangler.toml --dry-run --outdir "$RUNNER_TEMP/brain-hmac-bundle"
          ./brain/node_modules/.bin/wrangler deploy --config automation/self-heal-worker/wrangler.toml --dry-run --outdir "$RUNNER_TEMP/healer-hmac-bundle"

      - name: ONE bounded live private challenge with rollback
        id: live
        if: steps.gate.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_DEPLOY_TOKEN }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          OPERATOR_PR: '299'
          WRANGLER_SEND_METRICS: 'false'
        run: python3 brain/qa/live_parent_hmac_once.py run

      - name: Fail-safe rollback if the previous step failed
        if: always() && steps.gate.outputs.enabled == 'true' && steps.live.outcome != 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_STAGING_DEPLOY_TOKEN }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          OPERATOR_PR: '299'
        run: python3 brain/qa/live_parent_hmac_once.py recover
