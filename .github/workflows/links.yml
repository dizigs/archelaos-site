name: Archelaos link health

on:
  workflow_dispatch:
  schedule:
    # Daily, outside peak GitHub Actions start times (UTC).
    - cron: '17 4 * * *'
  push:
    paths:
      - '.github/workflows/links.yml'
      - '.github/scripts/prepare_link_audit.py'

permissions:
  contents: read

concurrency:
  group: archelaos-link-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  link-health:
    name: Public pages and archive source URLs
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out archive
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build and verify the published site
        run: |
          python rebuild/tools/build_release.py
          python rebuild/tools/verify_release.py
          python .github/scripts/prepare_link_audit.py

      - name: Restore polite checker cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .lycheecache
          key: lychee-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            lychee-${{ runner.os }}-

      - name: Check site and historical source links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        id: lychee
        with:
          # 403 and 429 are commonly anti-bot and rate-limit responses:
          # these are NOT evidence that a source article was deleted.
          args: >-
            --root-dir "${{ github.workspace }}/dist"
            --cache --max-cache-age 2d --no-progress
            --max-concurrency 6 --host-concurrency 2
            --timeout 18 --max-retries 1
            --accept '100..=103,200..=299,403,429'
            './dist/*.html'
            './lychee-inputs/archive-links.md'
          fail: false
          jobSummary: true
          output: lychee/out.md

      - name: Flag findings without altering published content
        if: steps.lychee.outputs.exit_code != '0'
        run: |
          echo "::warning::Broken links or unavailable sources detected. Review the Lychee job summary and artifact. Historical records are unchanged."

      - name: Save a downloadable report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: archelaos-links-report
          path: lychee/out.md
          if-no-files-found: warn
          retention-days: 14
