name: Free Actions lint and security audit
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
  schedule:
    - cron: '29 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify integrity and provenance of pinned actionlint 1.7.12
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint_1.7.12_linux_amd64.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
            --output "$archive" \
            'https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz'
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$archive" | sha256sum --check --status
          gh attestation verify --repo rhysd/actionlint "$archive"
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -version
      - name: Check all workflows (no secrets or site changes)
        run: '"$RUNNER_TEMP/actionlint" -color'
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Keep every legacy finding visible; the next pass blocks HIGH findings.
      - name: Report all Actions security findings
        continue-on-error: true
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          annotations: true
          inputs: .github/workflows
          collect: workflows
          persona: auditor
      - name: Block high-severity Actions security findings
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          annotations: true
          inputs: .github/workflows
          collect: workflows
          persona: auditor
          min-severity: high

  # TEMPORARY lockfile bootstrap only for this unmerged branch. Removed after
  # generated lockfile is reviewed and committed. Never writes to main.
  security-lock-bootstrap:
    if: github.event_name == 'pull_request' && github.head_ref == 'security/sonar-medium-actions-lockfiles-20261104'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Resolve pinned audit tools without running package scripts
        working-directory: .github/ci-security-tools
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-exact
      - name: Check generated lockfile metadata
        shell: bash
        run: |
          set -euo pipefail
          test -s .github/ci-security-tools/package-lock.json
          node -e 'const p=require("./.github/ci-security-tools/package-lock.json");if(p.lockfileVersion!==3||!p.packages||!p.packages[""])process.exit(1)'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archelaos-audit-lock-bootstrap
          path: .github/ci-security-tools/package-lock.json
          if-no-files-found: error
          retention-days: 1

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # Server-side graph diff only: no checkout or PR-controlled code execution.
      - name: Reject newly introduced high and critical dependency vulnerabilities
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          vulnerability-check: true
          license-check: false
          warn-only: false
          comment-summary-in-pr: never
