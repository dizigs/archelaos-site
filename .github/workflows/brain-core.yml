name: Brain core runtime and security regressions
on:
  pull_request:
    paths:
      - 'brain/**'
      - '.github/workflows/brain-core.yml'
      - '.github/workflows/cloudflare-pages-status.yml'
  push:
    branches: [main]
    paths:
      - 'brain/**'
      - '.github/workflows/brain-core.yml'
  workflow_dispatch:
    inputs:
      staging_readiness:
        description: Read isolated staging metadata only; never deploy or read bridge secrets
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact source commit for any later compiled bundle
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install exact locked packages without lifecycle scripts
        run: npm ci --prefix brain --ignore-scripts --no-audit --no-fund
      - name: Audit runtime dependency advisories without modifying dependencies
        run: npm audit --prefix brain --omit dev --audit-level high
      - name: Validate syntax and provider readiness evidence guards
        run: |
          npm run syntax --prefix brain
          python -m unittest discover -s brain/test -p '*_test.py' -v
      - name: Exercise actual workerd SQLite, alarms, restart, dedupe, DLQ and budget concurrency
        run: |
          npm test --prefix brain | tee "$RUNNER_TEMP/brain-tests.tap"
          python brain/tools/test_summary.py < "$RUNNER_TEMP/brain-tests.tap"
      - name: Compile staging-only Worker without deployment or credentials
        working-directory: brain
        run: ./node_modules/.bin/wrangler deploy --dry-run --outdir "$RUNNER_TEMP/brain-bundle"
      - name: Preserve exact compiled Brain bundle for staging byte review (no credentials)
        if: success() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: brain-staging-dryrun-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/brain-bundle/
          if-no-files-found: error
          retention-days: 3

  cloudflare-isolated-hmac-once:
    if: github.repository == 'dizigs/archelaos-site' && github.event_name == 'pull_request' && github.event.pull_request.number == 288 && github.event.pull_request.head.repo.full_name == 'dizigs/archelaos-site'
    needs: runtime
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: archelaos-qa-hmac-288
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: \${{ github.event.pull_request.head.sha }}
      - name: Gate one-shot execution on explicit commit subject
        id: once
        env:
          EXPECTED_SHA: \${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          if [ "$(git log -1 --format=%s)" = 'qa(remote): one-shot isolated Cloudflare HMAC acceptance' ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'No one-shot deployment requested.'
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.once.outputs.enabled == 'true'
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install exact Wrangler, no scripts
        if: steps.once.outputs.enabled == 'true'
        run: npm ci --prefix brain --ignore-scripts --no-audit --no-fund
      - name: Run isolated Cloudflare deployment and private HMAC acceptance
        if: steps.once.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: \${{ secrets.CLOUDFLARE_STAGING_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '898359728b3dfe8c3a3f56e3d19eecd1'
          EXPECTED_SHA: \${{ github.event.pull_request.head.sha }}
          QA_PR: '288'
          WRANGLER_SEND_METRICS: 'false'
        run: python3 brain/qa/cloudflare_isolated_acceptance.py

  staging-readiness:
    if: github.repository == 'dizigs/archelaos-site' && github.event_name == 'workflow_dispatch' && inputs.staging_readiness == true
    needs: runtime
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Verify evidence guards without provider credentials
        run: python -m unittest discover -s brain/test -p '*_test.py' -v
      - name: Inspect staging read access with the already-authorized dedicated read token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BRIDGE_READ_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: python brain/tools/cloudflare_staging.py --action staging-readiness
