name: Live site health
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-health.yml'
      - 'rebuild/tools/live_site_health.py'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: live-health
  cancel-in-progress: false
jobs:
  public-health:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check published site without credentials
        run: python rebuild/tools/live_site_health.py --json live-health-report.json
      - name: Retain public technical health report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-health-report
          path: live-health-report.json
          retention-days: 14
          if-no-files-found: warn
