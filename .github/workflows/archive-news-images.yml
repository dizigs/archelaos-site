name: Archive original news photographs
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/import_news_images.py'
      - 'tools/link_uploaded_news_images.py'
      - 'images/news/**'
      - '.github/workflows/archive-news-images.yml'
      - 'news.json'
concurrency:
  group: archelaos-news-photo-archive
  cancel-in-progress: true
permissions:
  contents: write
  pull-requests: write
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image processing dependency
        run: python -m pip install pillow
      - name: Verify importer and prevent logo regressions
        run: |
          python -m py_compile tools/import_news_images.py
          python - <<'PY'
          from tools.import_news_images import candidates
          page='https://www.handball.org.gr/ethnikes-katigories/efivon/5421'
          html='<meta property="og:image" content="/images/nea/LOGOS/ON_LIGHT_-_COMBO_x1.png"><article><img src="/images/nea/ethnikes-omades/team-2026.jpg"></article>'
          photos=candidates(page,html)
          assert photos==['https://www.handball.org.gr/images/nea/ethnikes-omades/team-2026.jpg'], photos
          html='<meta property="og:image" content="/images/nea/LOGOS/ON_LIGHT_-_COMBO_x1.png">'
          assert candidates(page,html)==[], 'Federation logo incorrectly accepted as article photo'
          PY
      - name: Link manually uploaded event photographs to matching news IDs
        run: python tools/link_uploaded_news_images.py
      - name: Import original event photos from verified source articles
        run: |
          python tools/import_news_images.py | tee /tmp/news-photo-import.log
          echo '### News photo archive results' >> "$GITHUB_STEP_SUMMARY"
          echo '\`\`\`' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/news-photo-import.log >> "$GITHUB_STEP_SUMMARY"
          echo '\`\`\`' >> "$GITHUB_STEP_SUMMARY"
      - name: Validate referenced images before publishing
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlsplit
          import re
          from PIL import Image
          data=json.loads(Path('news.json').read_text('utf-8'))
          for item in data['items']:
              photo=item.get('image','')
              if photo.startswith('images/news/'):
                  path=Path(photo)
                  assert path.is_file(), f"Missing article photograph: {item['id']}"
                  with Image.open(path) as im:
                      im.verify()
                  photo_path = urlsplit(str(item.get('imageSourceUrl', ''))).path.lower()
                  assert not re.search(r'(^|[/_.-])(logo|logos|logotype|favicon|placeholder|social-preview)([/_.-]|$)', photo_path), f"Non-article logo: {item['id']}"
          PY
      - name: Propose photo updates in a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "archelaos-archive-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json images/news
          if git diff --cached --quiet; then
            echo "No photograph updates to propose"
            exit 0
          fi
          branch="automation/news-photo-archive"
          git switch -c "$branch"
          git commit -m "Archive verified original article photographs for news"
          git push --force-with-lease origin "$branch"
          existing="$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "Updated PR #$existing"
          else
            gh pr create --head "$branch" --base main --title "Photos: archive verified article images" --body "Automatically sourced event photographs. Merge only after required checks pass."
          fi
