name: Site release QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate production build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check release scripts syntax
        run: python -m compileall -q rebuild/tools
      - name: Build production site and run release checks
        run: python rebuild/tools/build_release.py
      - name: Repeat read-only validation
        run: python rebuild/tools/verify_release.py
