name: Cloudflare Pages deployment status
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      verify_after_rebuild:
        type: boolean
        required: false
        default: false
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
  pull_request:
    paths:
      - 'tools/cloudflare_pages_status.py'
      - 'tools/cloudflare_deployment_evidence.py'
      - 'tests/test_cloudflare_deployment_evidence.py'
      - 'rebuild/tools/public_snapshot.py'
      - '.github/workflows/cloudflare-pages-status.yml'
      - '.github/workflows/rebuild-check.yml'
  schedule:
    - cron: '23 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'tools/cloudflare_pages_status.py'
      - 'tools/cloudflare_deployment_evidence.py'
      - 'tests/test_cloudflare_deployment_evidence.py'
      - 'rebuild/tools/public_snapshot.py'
      - '.github/workflows/cloudflare-pages-status.yml'
      - '.github/workflows/rebuild-check.yml'

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-status
  cancel-in-progress: false

jobs:
  offline-test:
    if: (github.event_name == 'pull_request' || github.event_name == 'push') && inputs.verify_after_rebuild != true
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Fault-inject deployment, log, SHA, access and HTTP failures offline
        run: python -m unittest discover -s tests -p test_cloudflare_deployment_evidence.py -v
  pages-status:
    if: >-
      github.repository == 'dizigs/archelaos-site' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      inputs.verify_after_rebuild == true))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify fault-injection tests before reading provider evidence
        run: python -m unittest discover -s tests -p test_cloudflare_deployment_evidence.py -v
      - name: Verify exact main commit, real production logs and public HTTP health
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: python tools/cloudflare_pages_status.py
      - name: Publish sanitized deployment evidence in summary
        if: always()
        shell: bash
        run: |
          if [ -f cloudflare-pages-status.json ]; then
            python -m json.tool cloudflare-pages-status.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain deployment status report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cloudflare-pages-status
          path: cloudflare-pages-status.json
          retention-days: 14
          if-no-files-found: warn
