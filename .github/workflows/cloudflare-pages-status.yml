name: Cloudflare Pages deployment status
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'tools/cloudflare_pages_status.py'
      - '.github/workflows/cloudflare-pages-status.yml'

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-status
  cancel-in-progress: false

jobs:
  pages-status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Query Cloudflare deployment status using secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: python tools/cloudflare_pages_status.py
      - name: Retain deployment status report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-pages-status
          path: cloudflare-pages-status.json
          retention-days: 14
          if-no-files-found: warn
