name: Validate sport-site registry
on:
  pull_request:
    paths:
      - 'config/sport-sites.json'
      - 'tools/validate_sport_sites.py'
      - 'tests/test_sport_sites_registry.py'
      - '.github/workflows/sport-sites-registry.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate schema and safety constraints
        run: |
          python tools/validate_sport_sites.py
          python -m unittest discover -s tests -p 'test_sport_sites_registry.py' -v
