name: Brain Build and Testing executor unit tests
on:
  pull_request:
    paths:
      - 'automation/brain-worker-executors/**'
      - '.github/workflows/brain-worker-executors-tests.yml'
  push:
    branches: [main]
    paths:
      - 'automation/brain-worker-executors/**'
      - '.github/workflows/brain-worker-executors-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Run executor contract tests
        run: node --test automation/brain-worker-executors/*.test.mjs
