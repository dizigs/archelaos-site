name: Canonical root recovery inventory
on:
  pull_request:
    paths:
      - 'rebuild/tools/canonical_root_inventory.py'
      - 'rebuild/tests/canonical_root_inventory_test.py'
      - 'rebuild/tools/canonical_root_snapshot.py'
      - 'rebuild/tests/canonical_root_snapshot_test.py'
      - 'rebuild/tools/canonical_root_zip_audit.py'
      - 'rebuild/tests/canonical_root_zip_audit_test.py'
      - '.github/workflows/weekly-public-snapshot.yml'
      - 'docs/recovery/CANONICAL_ROOT_RECOVERY.md'
      - '.github/workflows/canonical-root-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-public-root-records:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Synthetic public registry fault-injection tests
        run: python -m unittest discover -s rebuild/tests -p 'canonical_root_inventory_test.py' -v
      - name: Read-only inventory of actual checkout root data
        run: |
          python rebuild/tools/canonical_root_inventory.py > "$RUNNER_TEMP/canonical-inventory.json"
          python -m json.tool "$RUNNER_TEMP/canonical-inventory.json" > /dev/null
          python - <<'PY'
          import json, os
          from pathlib import Path
          report=json.loads((Path(os.environ["RUNNER_TEMP"])/"canonical-inventory.json").read_text())
          for e in report["entries"]:
              print(f"{e['file']}: {e['records']} IDs, sha256={e['sha256'][:12]}...")
          print("READ-ONLY inventory complete; provider restore NOT performed")
          PY

      - name: Exercise staged canonical root backup against real checkout
        run: |
          python -m unittest discover -s rebuild/tests -p 'canonical_root_snapshot_test.py' -v
          python rebuild/tools/canonical_root_snapshot.py --stage
          python rebuild/tools/canonical_root_snapshot.py --verify

      - name: ZIP safety checks and extraction-free readback
        run: |
          python -m unittest discover -s rebuild/tests -p 'canonical_root_zip_audit_test.py' -v
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import os
          d = Path(os.environ['RUNNER_TEMP']) / 'archelaos-public-canonical'
          out = Path(os.environ['RUNNER_TEMP']) / 'canonical-root-zip-rehearsal.zip'
          with ZipFile(out, 'w', ZIP_DEFLATED) as z:
              for name in sorted(['news.json', 'hall-of-fame-people.json',
                                  'archelaos-history-events.json',
                                  'canonical-root-snapshot-manifest.json']):
                  z.write(d / name, arcname=name)
          print('Built local ZIP rehearsal from actual checkout; not a saved GitHub artifact')
          PY
          python rebuild/tools/canonical_root_zip_audit.py "$RUNNER_TEMP/canonical-root-zip-rehearsal.zip" --source-commit "$GITHUB_SHA"
