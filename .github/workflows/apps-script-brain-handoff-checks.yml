name: Apps Script Brain handoff isolated tests
on:
  pull_request:
    paths:
      - 'automation/apps-script-brain-handoff/**'
      - '.github/workflows/apps-script-brain-handoff-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Syntax and offline PR124 integration regressions (no secrets)
        run: |
          node --check automation/apps-script-brain-handoff/handoff.mjs
          node --test automation/apps-script-brain-handoff/*.test.mjs
