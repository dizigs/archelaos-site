name: Apps Script safety and editor regressions
on:
  pull_request:
    paths:
      - 'automation/apps-script/**'
      - 'tests/apps-script/**'
      - '.github/workflows/apps-script-safety-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apps-script-safety-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  offline-security:
    name: Offline safety inventory and PR124 regressions
    if: github.repository == 'dizigs/archelaos-site'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout PR source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check safety module JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check automation/apps-script/safety/index.mjs
          node --check automation/apps-script/safety/store.mjs
          node --check automation/apps-script/safety/index.test.mjs
      - name: Run 15 isolated Apps Script safety tests (synthetic only)
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-reporter=tap automation/apps-script/safety/*.test.mjs
      - name: Run existing Apps Script editor, OAuth, rollback and bridge regressions
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-reporter=tap --test-concurrency=1 tests/apps-script/*.test.mjs
