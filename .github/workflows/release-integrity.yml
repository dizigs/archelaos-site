name: Release integrity
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Guard against visible literal escaped newlines and tabs
        run: |
          python -m unittest discover -s rebuild/tests -p 'guard_html_escaped_text_test.py' -v
          python rebuild/tools/guard_html_escaped_text.py
      - name: Inject a synthetic visible bug and prove exact safe self-repair
        run: python -m unittest discover -s rebuild/tests -p 'fault_injection_self_heal_test.py' -v
      - name: Test news photo self-heal and local image integrity
        run: |
          python -m pip install --only-binary=:all: pillow==13.0.0
          python -m unittest discover -s rebuild/tests -p news_photo_self_heal_test.py -v
      - name: Validate news-to-biography-to-event links and safe repair rules
        run: |
          python -m unittest discover -s rebuild/tests -p news_pipeline_self_heal_test.py -v
          python rebuild/tools/news_pipeline_self_heal.py
          python -m unittest discover -s rebuild/tests -p news_media_candidates_test.py -v
          python rebuild/tools/build_news_media_candidates.py
      - name: Validate canonical reciprocal public archive relationships
        run: python -m unittest discover -s rebuild/tests -p archive_relationships_test.py -v
      - name: Guard against SonarCloud workflow supply-chain regressions
        run: python -m unittest discover -s rebuild/tests -p security_workflows_test.py -v
      - name: Build and verify complete release
        run: python rebuild/tools/build_release.py
      - name: Recheck generated public HTML for escaped text
        run: python rebuild/tools/guard_html_escaped_text.py --dist
      - name: Verify JavaScript syntax
        run: |
          find dist/assets/site/js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Verify AI Worker JavaScript syntax
        run: node --check --input-type=module < rebuild/ai/worker.js
      - name: Test offline AI request limits and citation safety
        run: node rebuild/tests/ai_worker.cjs
      - name: Verify public-feed intake without network or scraping
        run: python rebuild/tests/public_mentions.py
      - name: Verify live-site monitor without network
        run: python rebuild/tests/live_site_health.py
      - name: Verify public archive snapshot matches generated release
        run: python rebuild/tests/public_snapshot.py
      - name: Verify generated HTML and data
        run: python rebuild/tools/verify_release.py
