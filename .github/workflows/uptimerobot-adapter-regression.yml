name: UptimeRobot adapter regression
on:
  pull_request:
    paths:
      - 'automation/uptimerobot/**'
      - '.github/workflows/uptimerobot-adapter-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  monitor-adapter-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Isolated, credential-free UptimeRobot adapter regression
        run: |
          node --check automation/uptimerobot/monitor-bridge.mjs
          node --check automation/uptimerobot/monitor-bridge.test.mjs
          node --test automation/uptimerobot/monitor-bridge.test.mjs
