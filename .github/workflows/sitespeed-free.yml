name: Free sitespeed visitor performance report
on:
  schedule:
    - cron: '31 5 * * 6'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  speed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build local static site
        run: |
          python rebuild/tools/build_release.py
          python rebuild/tools/verify_release.py
      - name: Install community sitespeed.io
        run: npm install --no-save --no-package-lock sitespeed.io
      - name: Collect one-run performance report without deploying
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8765 --bind 127.0.0.1 --directory dist >/tmp/sitespeed-server.log 2>&1 &
          npx sitespeed.io --browsertime.iterations 1 --browsertime.browser chrome --browsertime.chrome.args no-sandbox --outputFolder sitespeed-result http://127.0.0.1:8765/
      - name: Preserve speed results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archelaos-sitespeed-report
          path: sitespeed-result/
          retention-days: 14
          if-no-files-found: warn
