name: Site stability regressions
on:
  pull_request:
    paths:
      - 'rebuild/**'
      - 'assets/hof-inplace.js'
      - 'assets/news.js'
      - 'news.json'
      - 'news.html'
      - 'hall-of-fame-people.json'
      - 'interviews.json'
      - '.github/workflows/site-stability-regressions.yml'
  push:
    branches: [main]
    paths:
      - 'rebuild/**'
      - 'assets/hof-inplace.js'
      - 'assets/news.js'
      - 'news.json'
      - 'news.html'
      - 'hall-of-fame-people.json'
      - 'interviews.json'
      - '.github/workflows/site-stability-regressions.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site-stability-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install locked test dependencies without lifecycle scripts
        run: npm ci --prefix rebuild/tests/browser --ignore-scripts --no-audit --no-fund
      - name: Install the pinned Playwright Chromium runtime
        run: node rebuild/tests/browser/node_modules/playwright/cli.js install --with-deps chromium
      - name: Build and independently verify the release candidate
        run: |
          python rebuild/tools/build_release.py
          python rebuild/tools/verify_release.py
      - name: Serve the local release and wait for readiness
        shell: bash
        run: |
          python -m http.server 8766 --bind 127.0.0.1 --directory dist > /tmp/site-stability-server.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8766/index.html > /dev/null; then
              echo "Release preview ready at attempt $attempt"
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Exercise navigation, cards and real dialog regressions
        env:
          NODE_PATH: ${{ github.workspace }}/rebuild/tests/browser/node_modules
          SITE_STABILITY_BASE_URL: http://127.0.0.1:8766
        run: node rebuild/tests/site_stability.cjs
      - name: Verify canonical Hall IDs and bilingual biographies on desktop, tablet and mobile
        env:
          NODE_PATH: ${{ github.workspace }}/rebuild/tests/browser/node_modules
          SITE_STABILITY_BASE_URL: http://127.0.0.1:8766
        run: node rebuild/tests/hof_reconciliation.cjs
      - name: Audit WCAG and keyboard interactions with locked axe
        env:
          NODE_PATH: ${{ github.workspace }}/rebuild/tests/browser/node_modules
          SITE_STABILITY_BASE_URL: http://127.0.0.1:8766
        run: node rebuild/tests/a11y.cjs
      - name: Retain actual regression evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-stability-regressions
          path: |
            rebuild/test-artifacts/site-stability/
            rebuild/test-artifacts/accessibility/
          retention-days: 14
          if-no-files-found: warn
