name: Gemini public-news triage offline security tests
on:
  pull_request:
    paths:
      - 'automation/gemini-triage/**'
      - '.github/workflows/gemini-triage-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gemini-triage-safety:
    name: Gemini triage fake-provider tests (no secrets, no network)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check automation/gemini-triage/triage.mjs
          node --check automation/gemini-triage/triage.test.mjs
      - name: Assert secret-independent fail-closed contract
        run: |
          set -euo pipefail
          node --test automation/gemini-triage/triage.test.mjs
