name: Antigravity paid one-shot RPC security assertion review v2
on:
  push:
    branches:
      - assistant/antigravity-paid-rpc-targeted-answer-20261107
    paths:
      - '.github/workflows/antigravity-rpc-diagnose-20261107.yml'
permissions:
  contents: read
concurrency:
  group: paid-antigravity-rpc-v2-20261107
  cancel-in-progress: false
jobs:
  review:
    if: "github.repository == 'dizigs/archelaos-site' && github.event.head_commit.message == 'test(antigravity): approved paid final RPC test review'"
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - name: Checkout without GitHub credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: One paid review with GET-only polling and cancellation
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BASE_SHA: edb817f5077caec5a1495be11f0f90ba66d91e02
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const key=process.env.GEMINI_API_KEY;if(!key||key.length<16){console.log('MISSING_KEY');process.exit(2)}
          const headers={'Content-Type':'application/json','x-goog-api-key':key,'Api-Revision':'2026-05-20'};
          const base='https://generativelanguage.googleapis.com/v1beta/interactions';
          const payload={agent:'antigravity-preview-09-2026',input:"Focused defensive JavaScript/Cloudflare Miniflare RPC test diagnosis. Only read /workspace/evidence.txt; no external tools or internet.\nDeliver within 650 words: (1) exact plausible failure mechanisms, distinguishing confirmed vanilla JavaScript inheritance from unproven local RPC behavior.\n(2) Give a short test-only diagnostic PATCH TEMPLATE for the IMPLEMENTATION OF the RPC probe in the worker-side local test (not for its result boolean array), where result is property-name/origin/descriptor-category only, never actual values. Handle hostile Proxy traps as unsafe and stop.\n(3) Give matching caller-side assertion for the documented return shape and negative controls for OWN and INHERITED env, ctx, nonceStore, coordinator, memory; poisoned constructor and __proto__; custom prototype and getter. Do not weaken leak detection or treat unknown inherited capabilities as safe.\n(4) If original unpublished implementation is mandatory for a correct exact patch, state this, give minimal request to Codex and stop. Explicitly distinguish code proposal versus successful real 11/11 tests and actual Cloudflare E2E.\nDo not claim real file edits, secret reads, external API, deployment, or tested fixes. No agent subtask loops. Return an actionable tight answer early.",background:true,store:true,agent_config:{type:'antigravity',max_total_tokens:24000},environment:{type:'remote',sources:[{type:'inline',target:'/workspace/evidence.txt',content:"Repo dizigs/archelaos-site; current main edb817f5077caec5a1495be11f0f90ba66d91e02. Local Codex checkpoint 0b8df424d82fa53206846db448a862ee37634076 unpublished and NOT accessible from remote GitHub.\n\nExactly one failed local native Miniflare test: brain/test/private_hmac_acceptance.test.mjs:116: assert.ok((await f.call({op:'probe'})).every(Boolean)). 10 PASS / 1 FAIL. Probe tests both private RPC port objects for env, ctx, nonceStore, coordinator, memory, constructor and __proto__. Per-property boolean results not logged.\n\nMatching synthetic HMAC already validated, 1 RPC attempt and no repairs in earlier assertions. Live HMAC parity remains UNKNOWN and all recovery/dispatch flags OFF.\n\nPrevious paid Antigravity proposed inherited Object.prototype constructor and __proto__ could cause a false-positive if negated-in is used, but it provided an incorrect drop-in: assertBoundaryClean(probeResult) when probeResult is boolean[], not an RPC port.\n\nThe unpublished local files private_hmac_protocol.mjs, private_hmac_candidate.mjs, private_hmac_acceptance.test.mjs are unavailable to this API request. Never hallucinate their implementations."}]},tools:[]};
          const snooze=(ms)=>new Promise(r=>setTimeout(r,ms));
          console.log('SINGLE_PAID_POST_NO_RETRY_SHA',process.env.BASE_SHA);console.log('BEST_EFFORT_TOKEN_LIMIT',payload.agent_config.max_total_tokens);
          let response;try{response=await fetch(base,{method:'POST',headers,redirect:'error',body:JSON.stringify(payload),signal:AbortSignal.timeout(12000)})}catch(e){console.log('POST_OUTCOME_UNKNOWN_NO_RETRY',e.name);process.exit(3)}
          console.log('CREATE_HTTP_STATUS',response.status);const first=await response.json().catch(()=>({}));if(!response.ok){console.log('PROVIDER_STATUS',first.error?.status||'UNKNOWN');process.exit(4)}
          const id=first.id;if(!/^v1_[A-Za-z0-9_-]{20,512}$/.test(id||'')){console.log('NO_VALID_ID_DO_NOT_RETRY');process.exit(5)}
          console.log('INTERACTION_ID',id);let current=first;const terminal=new Set(['completed','incomplete','failed','cancelled','requires_action']);const deadline=Date.now()+115000;
          while(!terminal.has(current.status)&&Date.now()<deadline){await snooze(6000);let r;try{r=await fetch(base+'/'+encodeURIComponent(id),{method:'GET',headers,redirect:'error',signal:AbortSignal.timeout(8000)})}catch(e){console.log('GET_FAILED',e.name);break}if(!r.ok){console.log('GET_HTTP',r.status);break}const j=await r.json().catch(()=>({}));if(j.id!==id){console.log('ID_MISMATCH_STOP');break}current=j;console.log('POLL',current.status,current.usage?.total_tokens||'UNKNOWN')}
          if(!terminal.has(current.status)){console.log('TIME_LIMIT_ATTEMPT_CANCEL');try{const r=await fetch(base+'/'+encodeURIComponent(id)+'/cancel',{method:'POST',headers,redirect:'error',signal:AbortSignal.timeout(8000)});console.log('CANCEL_HTTP',r.status)}catch(e){console.log('CANCEL_UNKNOWN',e.name)}try{const r=await fetch(base+'/'+encodeURIComponent(id),{method:'GET',headers,redirect:'error',signal:AbortSignal.timeout(8000)});if(r.ok)current=await r.json()}catch{}}
          console.log('FINAL_PROVIDER_STATUS',current.status||'UNKNOWN');console.log('USAGE',JSON.stringify(current.usage||{}));const report=(current.steps||[]).filter(s=>s.type==='model_output').flatMap(s=>(s.content||[]).filter(p=>p.type==='text'&&typeof p.text==='string').map(p=>p.text)).join('\n');console.log('REPORT_BEGIN');console.log(report.slice(0,20000)||'(empty final report)');console.log('REPORT_END')
          NODE
