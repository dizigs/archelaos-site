name: Free visitor experience browser audit
# Run browser smoke checks on every site change; mandatory JS and ESLint
# checks are separate workflows and must also report on the PR head.
on:
  pull_request:
    paths:
      - 'rebuild/**'
      - 'assets/**'
      - 'images/**'
      - '.github/workflows/visitor-experience.yml'
      - '.github/scripts/visitor_smoke.cjs'
  push:
    branches: [main]
    paths:
      - 'rebuild/**'
      - 'assets/**'
      - 'images/**'
      - '.github/workflows/visitor-experience.yml'
      - '.github/scripts/visitor_smoke.cjs'
  schedule:
    - cron: '19 5 * * 2'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build validated public site locally
        run: |
          python rebuild/tools/build_release.py
          python rebuild/tools/verify_release.py
      - name: Install free Playwright browser
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install chromium --with-deps
      - name: Check desktop and mobile browsing without touching production
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory dist >/tmp/visitor-server.log 2>&1 &
          node .github/scripts/visitor_smoke.cjs
          SITE_STABILITY_BASE_URL=http://127.0.0.1:8765 node rebuild/tests/site_stability.cjs
      - name: Keep UX report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: archelaos-visitor-smoke
          path: |
            browser-smoke-report.json
            rebuild/test-artifacts/site-stability/
          retention-days: 14
          if-no-files-found: warn
