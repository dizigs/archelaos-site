name: Rebuild validation
on:
  push:
    branches:
      - rebuild/clean-foundation
    paths:
      - 'rebuild/**'
      - '.github/workflows/rebuild-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    name: HTML, data and JavaScript integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate content, images and internal file references
        run: python rebuild/tests/check.py
      - name: Check all rebuilt JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find rebuild/js -maxdepth 1 -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done
      - name: Ensure all rebuild HTML pages are unpublished previews
        shell: bash
        run: |
          set -euo pipefail
          test -f rebuild/index.html
          for page in rebuild/*.html; do
            grep -qi 'noindex' "$page" || { echo "Missing noindex in $page"; exit 1; }
          done

  browser:
    name: Chromium desktop and mobile
    runs-on: ubuntu-latest
    needs: integrity
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated browser test dependencies
        run: |
          npm install --no-save --ignore-scripts playwright@1.58.0
          npx playwright install --with-deps chromium
      - name: Start local preview server
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/archelaos-server.log 2>&1 &
      - name: Check interactive pages, menus, dialogs and forms
        run: node rebuild/tests/smoke.cjs
      - name: Capture backup-versus-rebuild reference views
        if: always()
        run: node rebuild/tests/visual.cjs
      - name: Preserve screenshots for final approval
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archelaos-rebuild-browser-proof
          path: rebuild/test-artifacts/
          if-no-files-found: warn
          retention-days: 14
