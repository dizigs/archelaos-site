name: Check clean rebuild (isolated)

on:
  push:
    branches:
      - 'rebuild/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check all rebuilt JavaScript syntax
        run: find rebuild/js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Validate data and HTML source paths
        run: python rebuild/tests/check.py
      - name: Install Chromium test browser
        run: |
          npm install --no-package-lock --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Smoke-test the isolated pages
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/archelaos-rebuild-http.log 2>&1 &
          node rebuild/tests/smoke.cjs
      - name: Capture original-backup and rebuild reference viewports
        run: node rebuild/tests/visual.cjs
      - name: Upload screenshots for visual comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archelaos-rebuild-smoke-screenshots
          path: rebuild/test-artifacts/
          if-no-files-found: ignore
          retention-days: 14
