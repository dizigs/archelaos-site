name: GitHub Actions PR permission smoke test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pr-permission-smoke.yml'
permissions:
  contents: read
jobs:
  probe:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: true
      - name: Create a disposable PR, without merging
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test_branch="automation/pr-permission-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$test_branch"
          mkdir -p .github/automation-probes
          printf 'Disposable permission probe run: %s\n' "$GITHUB_RUN_ID" > .github/automation-probes/pr-permission-smoke.txt
          git add .github/automation-probes/pr-permission-smoke.txt
          git commit -m "test: disposable Actions PR permission check"
          git push origin "$test_branch"
          pr_url="$(gh pr create --base main --head "$test_branch" --title "TEST: disposable GitHub Actions PR permission check" --body "Automated permissions test only. No website changes. This PR will be closed, never merged.")"
          echo "Created PR: $pr_url"
      - name: Close disposable PR and delete test branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        run: |
          set -euo pipefail
          test_branch="automation/pr-permission-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # The query must succeed, or cleanup status is unknown.
          gh pr list --head "$test_branch" --state open --json url --jq '.[].url' > /tmp/archelaos-probe-prs.txt
          while IFS= read -r pr_url; do
            if [ -n "$pr_url" ]; then
              gh pr close "$pr_url" --comment "Permission probe cleanup; intentionally not merged."
            fi
          done < /tmp/archelaos-probe-prs.txt
          remote_status=0
          git ls-remote --exit-code --heads origin "$test_branch" >/dev/null || remote_status=$?
          if [ "$remote_status" -eq 0 ]; then
            git push origin --delete "$test_branch"
          elif [ "$remote_status" -ne 2 ]; then
            echo "Cannot verify remote branch (git ls-remote exit $remote_status)." >&2
            exit "$remote_status"
          fi
          if [ "$PROBE_OUTCOME" = "success" ]; then
            echo "PASS: GitHub Actions can create and close pull requests."
          fi
