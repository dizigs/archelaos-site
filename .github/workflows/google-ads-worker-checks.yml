name: Google Ads Worker offline contract checks
on:
  pull_request:
    paths:
      - 'automation/google-ads-worker/**'
      - '.github/workflows/google-ads-worker-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-ads-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check all modules syntax
        run: npm run syntax --prefix automation/google-ads-worker
      - name: Verify PR70-derived non-importable plan
        run: npm run plan --prefix automation/google-ads-worker
      - name: Run isolated mocked Brain and Ads contract tests
        run: npm test --prefix automation/google-ads-worker
