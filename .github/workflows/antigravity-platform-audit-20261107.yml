name: Antigravity full Worker + Apps Script + site audit (isolated)
on:
  push:
    branches:
      - assistant/antigravity-platform-audit-20261107
    paths:
      - .github/workflows/antigravity-platform-audit-20261107.yml
      - automation/qa/antigravity_platform_audit_20261107.mjs
permissions:
  contents: read
concurrency:
  group: archelaos-antigravity-platform-audit-20261107
  cancel-in-progress: false
jobs:
  antigravity:
    name: Antigravity full inventory, tested safety fixes and site launch candidates
    if: "github.repository == 'dizigs/archelaos-site' && github.event.head_commit.message == 'ops(antigravity): audit all Workers and repository Apps Scripts'"
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout workflow harness (not the Antigravity sandbox)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # pinned
        with:
          node-version: '24'
      - name: Launch real Antigravity on entire Git repository and retain same interaction
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TARGET_MAIN_SHA: d39bf3ca00efba80d92f13b951ed4e22e7a4d58e
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node automation/qa/antigravity_platform_audit_20261107.mjs
      - name: Preserve source-locked advisory, patch and immutable interaction metadata
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: antigravity-platform-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/archelaos-platform-audit/
          if-no-files-found: warn
          retention-days: 14
