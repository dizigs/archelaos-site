name: Public press and social discovery
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-mentions.yml'
      - 'rebuild/tools/public_mentions.py'
      - 'rebuild/research/public-mentions-sources.json'
  schedule:
    - cron: '41 7 * * 2,5'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-mentions
  cancel-in-progress: false
jobs:
  public-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify no-scraping and review-only boundaries
        run: python rebuild/tests/public_mentions.py
      - name: Collect public article and video-feed mentions
        run: python rebuild/tools/public_mentions.py --output public-mentions-report.json
      - name: Preserve editorial candidates (public links, no private documents)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-mentions-review
          path: public-mentions-report.json
          retention-days: 14
          if-no-files-found: warn
