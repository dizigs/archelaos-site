name: Lighthouse CI - website quality

on:
  workflow_dispatch:
  # Required PR check: do not filter by file paths or status stays pending.
  pull_request:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lighthouse-ci.yml'
      - '.lighthouserc.cjs'
      - 'rebuild/**'
      - 'assets/**'
      - 'images/**'
      - 'news.json'
      - 'hall-of-fame-people.json'

permissions:
  contents: read

concurrency:
  group: lighthouse-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse CI mobile audit
    # Secrets must never be passed into CI running arbitrary fork PR code.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository with Git history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Build and validate static production output
        run: |
          python3 rebuild/tools/build_release.py
          python3 rebuild/tools/verify_release.py

      - name: Confirm Lighthouse GitHub App secret is available
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
        run: |
          if [ -z "$LHCI_GITHUB_APP_TOKEN" ]; then
            echo "::error::Add LHCI_GITHUB_APP_TOKEN under repository Settings > Secrets and variables > Actions"
            exit 1
          fi
          echo "Lighthouse GitHub App secret configured."

      - name: Install pinned Lighthouse CI CLI
        run: npm install --global '@lhci/cli@0.15.x'

      - name: Audit home, departments and news and post results to GitHub
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
          LHCI_BUILD_CONTEXT__CURRENT_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: lhci autorun --config=.lighthouserc.cjs

      - name: Preserve local Lighthouse reports for 14 days
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: archelaos-lighthouse-reports
          path: .lighthouseci/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  performance-lock-bootstrap:
    name: Temporary one-time performance lock verification
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'security/issue66-performance-lock-proof-20261104'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out isolated verification branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Generate full npm v3 lockfile and verify local CLI tools
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-fund --prefix .github/ci-performance-tools
          node -e "const p=require('./.github/ci-performance-tools/package-lock.json');if(p.lockfileVersion!==3)process.exit(1);for(const [n,v] of Object.entries(p.packages))if(n&&!v.integrity)throw new Error('Missing integrity: '+n)"
          npm ci --ignore-scripts --omit=optional --no-fund --prefix .github/ci-performance-tools
          ./.github/ci-performance-tools/node_modules/.bin/lhci --version
          ./.github/ci-performance-tools/node_modules/.bin/sitespeed.io --version
          npm audit --json --omit=optional --prefix .github/ci-performance-tools > .github/ci-performance-tools/npm-audit.json || true
          node -e "const a=require('./.github/ci-performance-tools/npm-audit.json');console.log('npm audit summary:',JSON.stringify(a.metadata?.vulnerabilities));if((a.metadata?.vulnerabilities?.high||0)+(a.metadata?.vulnerabilities?.critical||0)>0)process.exit(1)"
      - name: Preserve generated performance lockfile for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: archelaos-performance-lock-bootstrap
          path: |
            .github/ci-performance-tools/package-lock.json
            .github/ci-performance-tools/npm-audit.json
          retention-days: 3
          if-no-files-found: warn
