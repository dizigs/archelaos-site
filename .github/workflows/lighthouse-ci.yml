name: Lighthouse CI - website quality

on:
  workflow_dispatch:
  # Required PR check: do not filter by file paths or status stays pending.
  pull_request:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lighthouse-ci.yml'
      - '.lighthouserc.cjs'
      - 'rebuild/**'
      - 'assets/**'
      - 'images/**'
      - 'news.json'
      - 'hall-of-fame-people.json'
      - '.github/ci-performance-tools/**'

permissions:
  contents: read

concurrency:
  group: lighthouse-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse CI mobile audit
    # Secrets must never be passed into CI running arbitrary fork PR code.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository with Git history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Build and validate static production output
        run: |
          python3 rebuild/tools/build_release.py
          python3 rebuild/tools/verify_release.py

      - name: Confirm Lighthouse GitHub App secret is available
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
        run: |
          if [ -z "$LHCI_GITHUB_APP_TOKEN" ]; then
            echo "::error::Add LHCI_GITHUB_APP_TOKEN under repository Settings > Secrets and variables > Actions"
            exit 1
          fi
          echo "Lighthouse GitHub App secret configured."

      - name: Install locked local Lighthouse CI CLI
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund --prefix .github/ci-performance-tools
          npm audit --audit-level=high --prefix .github/ci-performance-tools --omit=dev

      - name: Audit home, departments and news and post results to GitHub
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
          LHCI_BUILD_CONTEXT__CURRENT_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: ./.github/ci-performance-tools/node_modules/.bin/lhci autorun --config=.lighthouserc.cjs

      - name: Prove actual locked sitespeed Chrome run with report (temporary, unmerged)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist >/tmp/sitespeed-proof-server.log 2>&1 &
          timeout 30 bash -c 'until curl -fsS http://127.0.0.1:8765/ >/dev/null; do sleep 0.2; done'
          CHROME_DRIVER="$(command -v chromedriver || true)"
          if [ -z "$CHROME_DRIVER" ] && [ -x "${CHROMEWEBDRIVER:-}/chromedriver" ]; then CHROME_DRIVER="$CHROMEWEBDRIVER/chromedriver"; fi
          if [ -z "$CHROME_DRIVER" ] || [ ! -x "$CHROME_DRIVER" ]; then echo "::error::GitHub runner compatible chromedriver missing"; exit 1; fi
          "$CHROME_DRIVER" --version
          ./.github/ci-performance-tools/node_modules/.bin/sitespeed.io --browsertime.iterations 1 --browsertime.browser chrome --browsertime.chrome.args no-sandbox --browsertime.chrome.chromedriverPath "$CHROME_DRIVER" --outputFolder sitespeed-result http://127.0.0.1:8765/
          test -d sitespeed-result
      - name: Upload temporary sitespeed browser report (never merge this step)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: issue66-temporary-sitespeed-browser-proof
          path: sitespeed-result/
          if-no-files-found: warn
          retention-days: 1

      - name: Preserve local Lighthouse reports for 14 days
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: archelaos-lighthouse-reports
          path: .lighthouseci/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
