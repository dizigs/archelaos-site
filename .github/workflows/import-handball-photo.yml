name: Import verified handball photograph
on:
  push:
    paths:
      - '.github/workflows/import-handball-photo.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  save-photo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve the submitted match photo from its original publication
        shell: bash
        env:
          PHOTO_URL: https://www.anexartitos.gr/wp-content/uploads/2025/11/Handball-%CE%9C%CE%93%CE%A3-%CE%A0%CE%B1%CE%BD%CF%83%CE%B5%CF%81%CF%81%CE%B1%CF%8A%CE%BA%CF%8C%CF%82-%CE%91%CF%81%CF%87%CE%AD%CE%BB%CE%B1%CE%BF%CF%82-37-30-3503.jpg
        run: |
          python - <<'PY'
          import os, pathlib, urllib.request, urllib.parse, time
          source=os.environ['PHOTO_URL']
          variants=[
            source,
            'https://wsrv.nl/?url='+urllib.parse.quote(source,safe=''),
            'https://images.weserv.nl/?url='+urllib.parse.quote(source,safe=''),
            'https://i0.wp.com/'+source.removeprefix('https://')
          ]
          for url in variants:
            for referer in ('https://www.anexartitos.gr/','https://aveserres.gr/'):
              try:
                headers={
                  'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/129.0 Safari/537.36',
                  'Accept':'image/avif,image/webp,image/apng,image/svg+xml,image/*;q=0.8,*/*;q=0.5',
                  'Referer':referer
                }
                with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=35) as response:
                  data=response.read(3500000)
                if len(data)<10000 or not data.startswith(bytes.fromhex('ffd8ff')):
                  raise ValueError('Not a valid JPEG: size='+str(len(data)))
                path=pathlib.Path('images/handball-archelaos-panserraikos-2025.jpg')
                path.parent.mkdir(exist_ok=True)
                path.write_bytes(data)
                print('Saved original photo locally, bytes:',len(data))
                raise SystemExit(0)
              except Exception as exc:
                print('Image source blocked:',str(exc)[:260],flush=True)
          raise SystemExit('Unable to save image using any public source')
          PY
      - name: Commit local image so the site no longer hotlinks the source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/handball-archelaos-panserraikos-2025.jpg
          if git diff --staged --quiet; then
            echo "Image is already synchronized."
          else
            git commit -m "Add local handball match photograph"
            git push origin HEAD:main
          fi
