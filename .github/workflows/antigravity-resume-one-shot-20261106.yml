name: Antigravity resume existing HMAC analysis (one-shot)
on:
  push:
    branches:
      - assistant/antigravity-agent-source-only-20261106
    paths:
      - .github/workflows/antigravity-resume-one-shot-20261106.yml
permissions:
  contents: read
concurrency:
  group: antigravity-resume-hmac-once-20261106
  cancel-in-progress: false
jobs:
  resume:
    if: "github.repository == 'dizigs/archelaos-site' && github.event.head_commit.message == 'run(antigravity): continue existing HMAC review with tools'"
    runs-on: ubuntu-latest
    timeout-minutes: 52
    permissions:
      contents: read
    steps:
      - name: Recover original interaction and complete review in remote sandbox
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ORIGINAL_ID: v1_Chc0a1R1YXNqYkl0bnJ6N0lQMzdiQXdBURIXNGtUdWFzamJJdG5yejdJUDM3YkF3QVE
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const key=process.env.GEMINI_API_KEY;
          if(typeof key!=='string'||key.length<16)throw Error('MISSING_GEMINI_API_KEY');
          const url='https://generativelanguage.googleapis.com/v1beta/interactions';
          const headers={'x-goog-api-key':key,'Api-Revision':'2026-05-20','Content-Type':'application/json'};
          const isId=x=>typeof x==='string'&&/^v1_[A-Za-z0-9_-]{12,512}$/.test(x);
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const request=async(path,method,body,timeout=30000)=>{
            const c=new AbortController(), t=setTimeout(()=>c.abort(),timeout);
            try {
              const r=await fetch(url+path,{method,headers,redirect:'error',signal:c.signal,...(body?{body:JSON.stringify(body)}:{})});
              const obj=await r.json().catch(()=>({}));
              if(!r.ok){console.log('PROVIDER_HTTP',method,r.status,'MESSAGE',String(obj.error?.message??'unknown').slice(0,250));return {ok:false,status:r.status,obj};}
              return {ok:true,status:r.status,obj};
            } finally {clearTimeout(t);}
          };
          const reportParts=[];
          const runs=[];
          let activeId=null;
          const write=()=>{
            fs.writeFileSync('antigravity-resume-status.json',JSON.stringify({runs,activeId,at:new Date().toISOString()},null,2));
            fs.writeFileSync('antigravity-resume-review.md',reportParts.join('\n\n-----\n\n').slice(0,90000)||'No report output yet.\n');
          };
          const extract=obj=>{
            const arr=[];
            for(const step of obj.steps??[]){
              if(step?.type!=='model_output')continue;
              if(typeof step.text==='string')arr.push(step.text);
              if(typeof step.content==='string')arr.push(step.content);
              for(const part of Array.isArray(step.content)?step.content:[])if(part?.type==='text'&&typeof part.text==='string')arr.push(part.text);
            }
            if(typeof obj.output_text==='string')arr.push(obj.output_text);
            return [...new Set(arr.filter(Boolean))].join('\n\n').slice(0,50000);
          };
          const cancel=async id=>{
            try{const r=await request('/'+encodeURIComponent(id)+'/cancel','POST',null,15000);console.log('CANCEL',r.status);}catch(e){console.log('CANCEL_UNCONFIRMED',e.name);}
          };
          const begin=Date.now(), deadline=begin+47*60*1000;
          const oldId=process.env.ORIGINAL_ID;
          if(!isId(oldId))throw Error('BAD_ORIGINAL_ID');
          console.log('READ_EXISTING_INTERACTION');
          const original=await request('/'+encodeURIComponent(oldId),'GET',null);
          if(!original.ok)throw Error('ORIGINAL_GET_FAILED_NO_NEW_RUN');
          let prev=original.obj;
          let prevId=oldId;
          let env=prev.environment_id;
          console.log('PREVIOUS_STATUS',prev.status,'HAS_ENVIRONMENT_ID',typeof env==='string'&&env.length>0,'PREVIOUS_TOKENS',prev.usage?.total_tokens??'unknown');
          const originalReport=extract(prev);
          if(originalReport){reportParts.push('# Prior review (incomplete)\n\n'+originalReport);}
          runs.push({id:prevId,status:prev.status,usage:prev.usage??null,hasEnvironment:!!env,preexisting:true});
          write();
          if(prev.status==='completed'){console.log('ORIGINAL_ALREADY_COMPLETED');process.exit(0);}
          if(prev.status!=='incomplete')throw Error('ORIGINAL_NOT_INCOMPLETE_NO_NEW_RUN');
          if(typeof env!=='string'||env.length<5)throw Error('MISSING_ENVIRONMENT_ID_NO_NEW_RUN');
          const MAX_NEW_CONTINUATIONS=2;
          for(let hop=1;hop<=MAX_NEW_CONTINUATIONS;hop++){
            if(Date.now()>deadline-4*60*1000){console.log('TIME_BUDGET_NO_NEW_CREATE');break;}
            const prompt=hop===1
              ? [
                'Continue the existing independent review of the public Brain <-> Self-Heal repository source snapshots already mounted in this environment.',
                'Your previous review was partial and identified candidate failures in HMAC and durable ACK settlement. Verify the candidates against the actual source, do not assert a hypothetical issue as proven.',
                'IMPORTANT: You now have your default sandbox filesystem and code execution tools; inspect source files using them. You may write/edit synthetic files only INSIDE THIS GOOGLE SANDBOX to test hypotheses, but do not modify GitHub or Cloudflare, do not use credentials or external APIs.',
                'Prioritize completing actionable engineering work rather than producing a long generic review. Produce a final concise technical report with specific line/function evidence; fully specified minimal patches/diffs for confirmed defects; concrete offline regression tests and commands; why UNKNOWN persists; blockers to real staging ACK. Explicitly identify false positives and findings already covered by tests.',
                'Do not enable recovery, merge, deploy or publish changes. Never report production authentication as verified.'
              ].join('\n')
              : 'Complete the remaining verified Brain <-> Self-Heal HMAC / durable ACK patch and regression-test report NOW. Do not repeat work. Output all important diffs and remaining exact tests in your final answer. Do not touch production or private services.';
            const body={agent:'antigravity-preview-09-2026',background:true,store:true,
              previous_interaction_id:prevId,environment:env,input:prompt,
              agent_config:{type:'antigravity',max_total_tokens:'350000'}};
            // The tools property is intentionally omitted to preserve the provider's built-in sandbox tools.
            console.log('CREATING_CONTINUATION',hop,'OF',MAX_NEW_CONTINUATIONS,'PREVIOUS',prevId);
            let created;
            try{created=await request('','POST',body,45000);}catch(e){console.log('CREATE_UNKNOWN_NO_POST_RETRY',e.name);process.exitCode=3;break;}
            if(!created.ok){console.log('CREATE_REJECTED',created.status);process.exitCode=2;break;}
            let current=created.obj;
            if(!isId(current.id)){console.log('CREATE_NO_VALID_ID_NO_RETRY');process.exitCode=3;break;}
            activeId=current.id;
            env=current.environment_id||env;
            console.log('NEW_INTERACTION_ID',activeId,'START_STATUS',current.status,'HAS_ENVIRONMENT',!!env);
            runs.push({id:activeId,status:current.status,hop,usage:current.usage??null,startedAt:new Date().toISOString()});
            write();
            let polls=0;
            while(['in_progress','queued','running','pending'].includes(current.status)&&Date.now()<deadline-50000){
              await sleep(20000);
              polls++;
              let got;
              try{got=await request('/'+encodeURIComponent(activeId),'GET',null,30000);}
              catch(e){console.log('GET_RETRYABLE_TRANSPORT',polls,e.name);continue;}
              if(!got.ok){console.log('GET_HTTP',polls,got.status);if([401,403,404].includes(got.status))break;continue;}
              if(got.obj.id!==activeId){console.log('GET_ID_MISMATCH');break;}
              current=got.obj;
              env=current.environment_id||env;
              const run=runs[runs.length-1];
              run.status=current.status;run.usage=current.usage??null;run.polls=polls;run.at=new Date().toISOString();
              if(polls%3===0||!['in_progress','queued','running','pending'].includes(current.status))console.log('POLL',hop,polls,'STATUS',current.status,'TOKENS',current.usage?.total_tokens??'unknown');
              write();
            }
            if(['in_progress','queued','running','pending'].includes(current.status)){
              console.log('RUN_NOT_TERMINAL_REQUESTING_CANCEL');await cancel(activeId);
              process.exitCode=4;write();break;
            }
            const gotText=extract(current);
            if(gotText)reportParts.push('# Continuation '+hop+' — '+current.status+'\n\n'+gotText);
            const run=runs[runs.length-1];run.status=current.status;run.usage=current.usage??null;run.reportChars=gotText.length;run.completedAt=new Date().toISOString();
            console.log('TERMINAL_STATUS',hop,current.status,'TOTAL_TOKENS',current.usage?.total_tokens??'unknown','REVIEW_CHARS',gotText.length);
            write();
            prevId=activeId;activeId=null;prev=current;
            if(current.status==='completed'){console.log('COMPLETE_SUCCESS');break;}
            if(current.status!=='incomplete'){console.log('NONCONTINUABLE_STATE');process.exitCode=2;break;}
            if(hop===MAX_NEW_CONTINUATIONS){console.log('CONTINUATION_LIMIT_REACHED');process.exitCode=2;}
          }
          const final=reportParts.join('\n\n-----\n\n');
          console.log('FINAL_PROVIDER_STATUS',prev.status,'TOTAL_REVIEW_CHARACTERS',final.length,'NEW_INTERACTIONS',runs.filter(x=>!x.preexisting).length);
          console.log('REPORT_EXCERPT_BEGIN');
          console.log(final.slice(-14500));
          console.log('REPORT_EXCERPT_END');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'## Antigravity resumed HMAC review\nProvider status: '+prev.status+'\nNew interactions: '+runs.filter(x=>!x.preexisting).length+'\nReview characters: '+final.length+'\n');
          if(prev.status!=='completed')process.exitCode=2;
          NODE
      - name: Upload diagnostic reports and interaction receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: antigravity-resumed-security-report
          path: |
            antigravity-resume-status.json
            antigravity-resume-review.md
          if-no-files-found: warn
          retention-days: 7
