name: Isolated healer Worker safety checks
on:
  pull_request:
    paths:
      - 'automation/self-heal-worker/**'
      - 'brain/src/private_hmac_candidate.mjs'
      - 'brain/src/private_hmac_protocol.mjs'
      - '.github/workflows/self-heal-worker-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  healer-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # pinned setup-node
        with:
          node-version: '22'
      - name: Worker and test source syntax
        run: |
          node --check automation/self-heal-worker/src/policy.mjs
          node --check automation/self-heal-worker/src/recipes.mjs
          node --check automation/self-heal-worker/src/ledger.mjs
          node --check automation/self-heal-worker/src/worker.mjs
          node --check automation/self-heal-worker/test/healer.test.mjs
      - name: Test durable SQLite ledger and fail-closed policy
        run: node --experimental-sqlite --test automation/self-heal-worker/test/*.test.mjs
      - name: Install pinned Wrangler for a credential-free Healer bundle check
        run: npm ci --prefix brain --ignore-scripts --no-audit --no-fund
      - name: Compile actual Healer Worker without deployment or credentials
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          ./brain/node_modules/.bin/wrangler deploy --config automation/self-heal-worker/wrangler.toml --dry-run --outdir "$RUNNER_TEMP/healer-bundle"
      - name: Guard private, unscheduled deployment configuration
        run: |
          python3 - <<'PY'
          import pathlib, tomllib
          path = pathlib.Path('automation/self-heal-worker/wrangler.toml')
          content = path.read_text(encoding='utf-8')
          config = tomllib.loads(content)
          assert config['name'] == 'archelaos-self-heal'
          assert config.get('workers_dev') is False
          assert not config.get('routes')
          assert not config.get('triggers', {}).get('crons')
          # Only the reviewed private named port, never a public/default Brain target.
          assert config.get('services') == [{
              'binding': 'BRAIN_RECOVERY',
              'service': 'archelaos-brain-staging',
              'entrypoint': 'BrainRecoveryPort',
          }]
          assert config['durable_objects']['bindings'][0]['name'] == 'HEALER_MEMORY'
          assert 'HealerMemory' in config['migrations'][0]['new_sqlite_classes']
          worker = pathlib.Path('automation/self-heal-worker/src/worker.mjs').read_text(encoding='utf-8')
          assert 'async fetch()' in worker and 'status: 404' in worker
          assert 'fetch(' not in worker.replace('async fetch()', '')
          print('Private, no cron, no public route and no outbound network path: PASS')
          PY
