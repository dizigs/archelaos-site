name: Ad Grants offline dry-run
on:
  pull_request:
    paths:
      - 'rebuild/ads/**'
      - '.github/scripts/ad_grants_issue_plan.py'
      - '.github/tests/test_ad_grants_issue_plan.py'
      - '.github/workflows/ad-grants-dry-run.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test consent, policy indicators and read-only collector offline
        run: node --test rebuild/ads/tests/core.test.cjs
      - name: Test public-safe Issue dedup without GitHub writes
        run: python -m unittest discover -s .github/tests -p test_ad_grants_issue_plan.py -v
      - name: Build inert preview and exercise synthetic Issue planning
        run: |
          node rebuild/ads/build_preview.cjs
          node --check rebuild/test-artifacts/ad-grants/google-ads-audit.js
          python .github/scripts/ad_grants_issue_plan.py --fixture
