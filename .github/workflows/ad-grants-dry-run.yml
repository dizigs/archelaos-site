name: Ad Grants offline dry-run
on:
  pull_request:
    paths:
      - 'rebuild/ads/**'
      - '.github/scripts/ad_grants_issue_plan.py'
      - '.github/tests/test_ad_grants_issue_plan.py'
      - '.github/tests/test_ad_grants_pipeline.py'
      - '.github/workflows/ad-grants-dry-run.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test consent, policy indicators and read-only collector offline
        run: node --test rebuild/ads/tests/*.test.cjs
      - name: Test public-safe Issue dedup without GitHub writes
        run: python -m unittest discover -s .github/tests -p 'test_ad_grants*.py' -v
      - name: Build inert preview and exercise synthetic Issue planning
        run: bash rebuild/ads/run_dry_run.sh --fixture
