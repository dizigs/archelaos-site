name: Free axe accessibility audit
on:
  pull_request:
    paths:
      - 'rebuild/**'
      - 'assets/**'
      - '.github/workflows/axe-accessibility.yml'
      - '.github/scripts/axe_audit.cjs'
      - 'news.html'
      - 'hall-of-fame.html'
  push:
    branches: [main]
    paths:
      - 'rebuild/**'
      - 'assets/**'
      - '.github/workflows/axe-accessibility.yml'
      - '.github/scripts/axe_audit.cjs'
      - 'news.html'
      - 'hall-of-fame.html'
  schedule:
    - cron: '53 5 * * 4'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  axe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build and verify static release without deployment
        run: |
          python rebuild/tools/build_release.py
          python rebuild/tools/verify_release.py
      - name: Install free browser accessibility tools
        run: |
          set -euo pipefail
          echo 'Checking exact #155 lockfile SHA-256'
          echo '1213962dafd000c2e1ff2498277c5c7ef9ebe1d955be519e46e1a54d8a182fa5  .github/ci-security-tools/package-lock.json' | sha256sum --check
          npm ci --ignore-scripts --no-audit --no-fund --prefix .github/ci-security-tools
          ./.github/ci-security-tools/node_modules/.bin/playwright --version
          ./.github/ci-security-tools/node_modules/.bin/playwright install chromium --with-deps
      - name: Audit home, news and Hall of Fame (report-only)
        env:
          NODE_PATH: ${{ github.workspace }}/.github/ci-security-tools/node_modules
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8765 --bind 127.0.0.1 --directory dist >/tmp/axe-server.log 2>&1 &
          timeout 30 bash -c 'until curl -fsS http://127.0.0.1:8765/ >/dev/null; do sleep 0.2; done'
          node .github/scripts/axe_audit.cjs
      - name: Preserve accessibility findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: archelaos-axe-audit
          path: axe-report.json
          if-no-files-found: warn
          retention-days: 14
