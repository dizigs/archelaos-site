name: Free axe accessibility audit
on:
  pull_request:
    paths:
      - 'rebuild/**'
      - 'assets/**'
      - '.github/workflows/axe-accessibility.yml'
      - '.github/scripts/axe_audit.cjs'
      - 'news.html'
      - 'hall-of-fame.html'
  push:
    branches: [main]
    paths:
      - 'rebuild/**'
      - 'assets/**'
      - '.github/workflows/axe-accessibility.yml'
      - '.github/scripts/axe_audit.cjs'
      - 'news.html'
      - 'hall-of-fame.html'
  schedule:
    - cron: '53 5 * * 4'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  axe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and verify static release without deployment
        run: |
          python rebuild/tools/build_release.py
          python rebuild/tools/verify_release.py
      - name: Install free browser accessibility tools
        run: |
          npm install --no-save --no-package-lock playwright @axe-core/playwright
          npx playwright install chromium --with-deps
      - name: Audit home, news and Hall of Fame (report-only)
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8765 --bind 127.0.0.1 --directory dist >/tmp/axe-server.log 2>&1 &
          timeout 30 bash -c 'until curl -fsS http://127.0.0.1:8765/ >/dev/null; do sleep 0.2; done'
          node .github/scripts/axe_audit.cjs
      - name: Preserve accessibility findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archelaos-axe-audit
          path: axe-report.json
          if-no-files-found: warn
          retention-days: 14
