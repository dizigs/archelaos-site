name: Free axe accessibility audit
on:
  pull_request:
    paths:
      - 'rebuild/**'
      - 'assets/**'
      - '.github/workflows/axe-accessibility.yml'
      - '.github/ci-security-tools/**'
      - '.github/scripts/axe_audit.cjs'
      - 'news.html'
      - 'hall-of-fame.html'
  push:
    branches: [main]
    paths:
      - 'rebuild/**'
      - 'assets/**'
      - '.github/workflows/axe-accessibility.yml'
      - '.github/ci-security-tools/**'
      - '.github/scripts/axe_audit.cjs'
      - 'news.html'
      - 'hall-of-fame.html'
  schedule:
    - cron: '53 5 * * 4'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  axe:
    permissions:
      contents: write # temporary same-repo proof branch only; never merge
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build and verify static release without deployment
        run: |
          python rebuild/tools/build_release.py
          python rebuild/tools/verify_release.py
      - name: Generate and normalize full npm v3 perf lock with official registry integrity
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefix .github/ci-performance-tools
          # npm 10 currently materializes foreign optional esbuild platforms as mandatory in first lock.
          # npm's second offline lock-only normalization prunes those platforms on this Linux runner.
          npm install --package-lock-only --ignore-scripts --offline --no-audit --no-fund --prefix .github/ci-performance-tools
          # Upgrade all transitive packages within pinned compatible ranges. Final npm audit remains a hard gate.
          if npm audit fix --package-lock-only --ignore-scripts --no-fund --prefix .github/ci-performance-tools; then
            echo 'npm fixed available advisories within existing dependency ranges'
          else
            echo 'npm audit fix could not remediate every advisory; final audit must still pass'
          fi
          npm install --package-lock-only --ignore-scripts --offline --no-audit --no-fund --prefix .github/ci-performance-tools
          node <<'NODE'
          const fs=require('fs'),cp=require('child_process');
          const file='.github/ci-performance-tools/package-lock.json';
          const j=JSON.parse(fs.readFileSync(file,'utf8'));
          if(j.lockfileVersion!==3)throw Error('unexpected npm lockfile version');
          const targets=[
            ['node_modules/sitespeed.io/node_modules/tar','tar','7.5.22'],
            ['node_modules/basic-ftp','basic-ftp','6.2.5'],
            ['node_modules/sitespeed.io/node_modules/@tootallnate/once','@tootallnate/once','2.0.1'],
            ['node_modules/sitespeed.io/node_modules/axios','axios','1.20.0'],
            ['node_modules/sitespeed.io/node_modules/brace-expansion','brace-expansion','1.1.21'],
            ['node_modules/sitespeed.io/node_modules/fast-xml-builder','fast-xml-builder','1.1.7'],
            ['node_modules/sitespeed.io/node_modules/fast-xml-parser','fast-xml-parser','5.7.2'],
            ['node_modules/sitespeed.io/node_modules/form-data','form-data','2.5.6'],
            ['node_modules/sitespeed.io/node_modules/axios/node_modules/form-data','form-data','4.0.6'],
            ['node_modules/sitespeed.io/node_modules/jws','jws','4.0.1'],
            ['node_modules/sitespeed.io/node_modules/lodash','lodash','4.18.1'],
            ['node_modules/sitespeed.io/node_modules/minimatch','minimatch','3.1.5'],
            ['node_modules/sitespeed.io/node_modules/node-forge','node-forge','1.4.2'],
            ['node_modules/sitespeed.io/node_modules/tmp','tmp','0.2.7'],
            ['node_modules/sitespeed.io/node_modules/ws','ws','7.5.13'],
            ['node_modules/sitespeed.io/node_modules/selenium-webdriver/node_modules/ws','ws','8.22.1']
          ];
          const metaCache=new Map(),metadataErrors=[];let replaced=0;
          for(const [path,name,version] of targets){
           const old=j.packages[path];
           if(!old)throw Error('Expected dependency absent: '+path);
           if(old.version===version)continue;
           const key=name+'@'+version;
           let meta=metaCache.get(key);
           if(!meta){try{meta=JSON.parse(cp.execFileSync('npm',['view',key,'--json'],{encoding:'utf8',maxBuffer:1e7,stdio:['ignore','pipe','pipe']}));metaCache.set(key,meta)}catch(e){metadataErrors.push(key);console.error('Missing or inaccessible official version:',key);continue;}}
           if(meta.name!==name||meta.version!==version||!meta.dist?.integrity?.startsWith('sha512-')||!meta.dist.tarball.startsWith('https://registry.npmjs.org/'))throw Error('untrusted metadata '+key);
           const newer={...old,version,resolved:meta.dist.tarball,integrity:meta.dist.integrity};
           for(const field of ['dependencies','optionalDependencies','peerDependencies','peerDependenciesMeta','engines','bin']){
            if(meta[field])newer[field]=meta[field];else delete newer[field];
           }
           j.packages[path]=newer;replaced++;
           console.log('Pinned official npm:',path,version);
          }
          if(metadataErrors.length)throw Error('Official npm versions missing: '+metadataErrors.join(', '));
          if(j.packages['node_modules/zod']?.version!=='4.6.7')throw Error('missing patched zod4');
          delete j.packages['node_modules/sitespeed.io/node_modules/zod'];
          fs.writeFileSync(file,JSON.stringify(j,null,2)+'\n');
          console.log('Official metadata transitive upgrades:',replaced);
          NODE
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefix .github/ci-performance-tools
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('.github/ci-performance-tools/package-lock.json','utf8'));
          const all=Object.entries(p.packages);const rest=all.filter(([n])=>n);
          if(p.lockfileVersion!==3||rest.some(([,x])=>!x.integrity))throw Error('bad npm v3 lock integrity');
          for(const [n,x] of rest){
           if(n.endsWith('/zod')&&x.version!=='4.6.7')throw Error('vulnerable zod '+n+'@'+x.version);
           if(n.endsWith('/tar')&&x.version!=='7.5.22')throw Error('vulnerable tar '+n+'@'+x.version);
           if(x.os&&!x.os.includes('linux')&&!x.optional)throw Error('foreign platform nonoptional '+n)
          }
          console.log('SAFE LOCK npm v3 packages',all.length,'with',rest.length,'integrity entries; tar7.5.22 and zod4.6.7');
          NODE
          sha256sum .github/ci-performance-tools/package-lock.json
      - name: Prove actual Linux npm ci, both performance CLI entrypoints and npm high-risk audit
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund --prefix .github/ci-performance-tools
          test -x .github/ci-performance-tools/node_modules/.bin/lhci
          test -x .github/ci-performance-tools/node_modules/.bin/sitespeed.io
          ./.github/ci-performance-tools/node_modules/.bin/lhci --version
          ./.github/ci-performance-tools/node_modules/.bin/sitespeed.io --version
          npm audit --audit-level=high --prefix .github/ci-performance-tools --omit=dev
      - name: Commit verified performance lock to dedicated non-main dependency branch
        if: github.event_name == 'pull_request' && github.head_ref == 'chatgpt/issue66-performance-lock-gen-proof-20261104' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'dizigs/archelaos-site'
          test "$GITHUB_HEAD_REF" = 'chatgpt/issue66-performance-lock-gen-proof-20261104'
          cp .github/ci-performance-tools/package-lock.json /tmp/issue66-perf-lockfile.json
          git fetch --no-tags origin refs/heads/chatgpt/issue66-performance-deps-20261104:refs/remotes/origin/issue66-perf-deps
          git switch -c issue66-perf-deps origin/issue66-perf-deps
          cp /tmp/issue66-perf-lockfile.json .github/ci-performance-tools/package-lock.json
          git add .github/ci-performance-tools/package-lock.json
          git -c user.name='Archelaos CI Proof' -c user.email='admin@archelaos.club' commit -m 'ci(security): commit hosted-verified performance npm v3 lock (#66)'
          AUTH=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/chatgpt/issue66-performance-deps-20261104
      - name: Preserve temporary performance lockfile for audited dependency PR
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: issue66-performance-lockfile-proof
          path: .github/ci-performance-tools/package-lock.json
          if-no-files-found: warn
          retention-days: 1
      - name: Install free browser accessibility tools
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund --prefix .github/ci-security-tools
          ./.github/ci-security-tools/node_modules/.bin/playwright install chromium --with-deps
      - name: Audit home, news and Hall of Fame (report-only)
        env:
          NODE_PATH: ${{ github.workspace }}/.github/ci-security-tools/node_modules
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8765 --bind 127.0.0.1 --directory dist >/tmp/axe-server.log 2>&1 &
          timeout 30 bash -c 'until curl -fsS http://127.0.0.1:8765/ >/dev/null; do sleep 0.2; done'
          node .github/scripts/axe_audit.cjs
      - name: Preserve accessibility findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: archelaos-axe-audit
          path: axe-report.json
          if-no-files-found: warn
          retention-days: 14
